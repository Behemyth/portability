[project]
description = "Foundational system properties for multi-platform applications."
name = "portability"

license = { text = "MIT" }

authors = [{ name = "Synodic Software", email = "contact@synodic.software" }]

readme = "README.md"

dynamic = ["version"]

dependencies = []
requires-python = ">=3.15"

[project.urls]
homepage = "https://github.com/synodic/portability"
repository = "https://github.com/synodic/portability"

[dependency-groups]
lint = ["ruff>=0.15.22", "pyrefly>=1.2.0.dev2", "isort>=9.0.0b1"]
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-mock>=3.15.1"]
config = ["copier>=9.17.0"]
docs = ["zensical>=0.0.51"]
native = ["cppython[cmake,conan,git]", "ninja>=1.13.0"]

[tool.cppython]
dependencies = ['gtest==1.17.0', 'cppaste>=0.0.0.dev1']

[tool.cppython.generators.cmake]
preset_file = "tool/cmake/platform/common/CMakePresets.json"
configuration_name = "default"

[tool.cppython.providers.conan]
remotes = []
skip_upload = true
settings = { "compiler.cppstd" = "23" }

[tool.pytest.ini_options]
log_cli = true
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
ignore = ["D206", "D300", "D415", "E111", "E114", "E117"]
select = [
	"D",   # pydocstyle
	"F",   # Pyflakes
	"I",   # isort
	"PL",  # pylint
	"UP",  # pyupgrade
	"E",   # pycodestyle
	"B",   # flake8-bugbear
	"SIM", # flake8-simplify
	"PT",  # flake8-pytest-style
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "single"

[tool.coverage.report]
skip_empty = true

[tool.pdm.scripts]
build = "cppython build"
test = "cppython test"
serve = "zensical serve"
config-check = "copier check-update ."
config-update = "copier update --conflict inline --skip-answered ."

[tool.pdm.resolution]
allow-prereleases = true

[build-system]
build-backend = "pdm.backend"
requires = ["pdm.backend"]
